# App Config
spring.application.name=canvasminilab
server.port=8080

# Canvas API Configuration
# Reads from environment variable CANVAS_API_TOKEN, defaults to empty if not set
canvas.api.token=${CANVAS_API_TOKEN:}
canvas.base.url=${CANVAS_BASE_URL:https://boisestatecanvas.instructure.com}

# Thymeleaf Cache (disable during development so template changes apply immediately)
spring.thymeleaf.cache=false