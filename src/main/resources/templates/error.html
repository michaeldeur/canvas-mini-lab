<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error - Canvas Mini-Lab</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 4rem auto; padding: 0 1rem; }
        .error-card { background-color: #fdf2f2; border: 1px solid #f8b4b4; border-radius: 8px; padding: 2rem; color: #9b1c1c; }
        h1 { margin-top: 0; font-size: 1.5rem; }
        a { color: #0066cc; font-weight: bold; }
    </style>
</head>
<body>

<div class="error-card">
    <h1>An Error Occurred</h1>
    <p th:text="${errorMessage != null ? errorMessage : (message != null ? message : error)}">
        Detailed error message will appear here.
    </p>
    <p><strong>Troubleshooting Tip:</strong> Make sure your <code>CANVAS_API_TOKEN</code> is set in your environment variables and has not expired in Canvas Settings.</p>
    <br>
    <a href="/">&larr; Back to Home</a>
</div>

</body>
</html>
